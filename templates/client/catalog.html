<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — La casa de las campanas</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="dark-mode flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav id="main-navbar" class="fixed top-0 left-0 w-full px-6 py-4 flex items-center justify-between z-50 shadow-md">
        <a href="{{ url_for('index') }}" class="text-xl font-bold text-[#805539] hover:text-[#B9987C] transition-colors duration-300">
            La casa de las campanas
        </a>
        <div class="flex items-center gap-6">
            <!-- Search -->
            <div class="relative hidden md:block">
                <input type="text" id="search-input" placeholder="Buscar producto..."
                       class="pl-4 pr-10 py-2 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-[#805539] transition-all duration-300"
                       style="background:var(--color-bg-card-dark);color:var(--color-text-light);border:1px solid var(--color-border-dark);">
                <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-[#5B5049] text-sm"></i>
            </div>
            <!-- Cart -->
            <button id="cart-btn" class="relative text-2xl text-gray-300 hover:text-green-500 transition-colors duration-300">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-badge" class="hidden absolute -top-2 -right-2 bg-red-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
            <!-- User -->
            <div class="flex items-center gap-3 text-sm">
                <span class="text-[#B9987C] font-medium hidden sm:inline">{{ current_user.username }}</span>
                <a href="{{ url_for('logout') }}" class="text-[#5B5049] hover:text-[#B9987C] transition-colors duration-200">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-20">
        <!-- Filter + count bar -->
        <div class="sticky top-16 z-30 px-6 py-3 flex flex-wrap items-center justify-between gap-3"
             style="background:var(--color-bg-card-dark);border-bottom:1px solid var(--color-border-dark);">
            <!-- Category filters -->
            <div class="flex flex-wrap gap-2">
                <button class="cat-btn active" data-cat="todos">Todos</button>
                <button class="cat-btn" data-cat="hornos">Hornos</button>
                <button class="cat-btn" data-cat="neveras">Neveras</button>
                <button class="cat-btn" data-cat="estufas">Estufas</button>
                <button class="cat-btn" data-cat="mesas de preparación">Mesas</button>
                <button class="cat-btn" data-cat="lavado de platos">Lavado</button>
            </div>
            <!-- Item count selector -->
            <div class="flex items-center gap-2 text-sm text-[#5B5049]">
                <span>Mostrar:</span>
                <button class="count-btn active" data-count="4">4</button>
                <button class="count-btn" data-count="10">10</button>
                <button class="count-btn" data-count="18">18</button>
                <button class="count-btn" data-count="999">Todos</button>
            </div>
        </div>

        <!-- Bento grid -->
        <div id="bento-grid" class="bento-grid px-6 py-6 max-w-6xl mx-auto">
            <!-- Populated by JS -->
        </div>

        <div id="empty-state" class="hidden text-center py-20 text-[#5B5049]">
            <i class="fas fa-search text-4xl mb-3"></i>
            <p class="text-lg">No se encontraron productos.</p>
        </div>
    </main>

    <!-- Cart sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-80 z-50 flex flex-col shadow-2xl transition-transform duration-300 translate-x-full"
         style="background:var(--color-bg-card-dark);">
        <div class="flex items-center justify-between p-5 border-b border-gray-700">
            <h2 class="text-lg font-bold">Tu cotización</h2>
            <button id="close-cart" class="text-2xl text-[#5B5049] hover:text-white transition-colors duration-200">&times;</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-3">
            <p id="cart-empty-msg" class="text-center text-[#5B5049] italic mt-8">Tu carrito está vacío.</p>
        </div>
        <div class="p-5 border-t border-gray-700 space-y-3">
            <div class="flex justify-between text-sm text-[#5B5049]">
                <span>Total estimado</span>
                <span id="cart-total" class="text-[#805539] font-bold text-base">$0.00</span>
            </div>
            <textarea id="order-notes" rows="2" placeholder="Notas adicionales (opcional)..."
                      class="w-full p-2 rounded-md text-sm resize-none"
                      style="background:var(--color-bg-dark);color:var(--color-text-light);border:1px solid var(--color-border-dark)"></textarea>
            <button id="submit-order-btn"
                    class="w-full py-3 rounded-md font-semibold text-white transition-colors duration-300 disabled:opacity-40 disabled:cursor-not-allowed"
                    style="background:var(--color-primary);"
                    disabled>
                <i class="fas fa-paper-plane mr-2"></i> Solicitar cotización
            </button>
            <div id="order-status" class="hidden text-sm text-center rounded-md p-2"></div>
        </div>
    </div>
    <div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-60 z-40 hidden"></div>

    <!-- Product detail modal -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background:rgba(0,0,0,0.7);">
        <div class="relative rounded-2xl overflow-hidden max-w-lg w-full shadow-2xl" style="background:var(--color-bg-card-dark);">
            <button id="close-modal" class="absolute top-4 right-4 text-2xl text-[#5B5049] hover:text-white z-10">&times;</button>
            <img id="modal-img" src="" alt="" class="w-full h-64 object-cover">
            <div class="p-6">
                <span id="modal-category" class="inline-block text-xs font-semibold px-2 py-1 rounded-full mb-3"
                      style="background:rgba(128,85,57,0.2);color:#805539;"></span>
                <h2 id="modal-name" class="text-2xl font-bold mb-2"></h2>
                <p id="modal-desc" class="text-[#5B5049] text-sm leading-relaxed mb-4"></p>
                <div class="flex items-center justify-between">
                    <span id="modal-price" class="text-2xl font-bold text-[#805539]"></span>
                    <button id="modal-add-btn" class="py-2 px-6 rounded-full font-semibold text-white transition-colors duration-300"
                            style="background:var(--color-primary);">
                        <i class="fas fa-cart-plus mr-2"></i> Añadir al carrito
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (() => {
        let allProducts = [];
        let cart = [];
        let activeCategory = 'todos';
        let displayCount = 4;
        let currentModalProduct = null;

        // ── Fetch products ──────────────────────────────────────────────────
        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                allProducts = await res.json();
                render();
            } catch (e) {
                console.error('Error cargando productos:', e);
            }
        }

        // ── Bento render ────────────────────────────────────────────────────
        function render() {
            const grid = document.getElementById('bento-grid');
            const empty = document.getElementById('empty-state');
            const search = document.getElementById('search-input').value.toLowerCase();

            let filtered = allProducts.filter(p => {
                const matchCat = activeCategory === 'todos' || p.category.toLowerCase().includes(activeCategory);
                const matchSearch = !search || p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            const visible = filtered.slice(0, displayCount);

            if (visible.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            grid.innerHTML = visible.map((p, i) => {
                const cyclePos = i % 3;
                const isFeatured = cyclePos === 0;
                return `
                    <div class="bento-item ${isFeatured ? 'bento-featured' : 'bento-small'}"
                         data-id="${p.id}">
                        <img src="${p.image}" alt="${p.name}"
                             onerror="this.src='https://placehold.co/800x500/5B5049/DDDDD8?text=${encodeURIComponent(p.name)}'">
                        <div class="bento-overlay">
                            <span class="bento-cat-badge">${p.category}</span>
                            <h3 class="bento-title">${p.name}</h3>
                            <div class="flex items-center justify-between mt-3">
                                <span class="bento-price">$${p.price}</span>
                                <button class="bento-add-btn" data-id="${p.id}" onclick="event.stopPropagation()">
                                    <i class="fas fa-cart-plus"></i> Añadir
                                </button>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            // Open modal on card click
            grid.querySelectorAll('.bento-item').forEach(card => {
                card.addEventListener('click', () => {
                    const p = allProducts.find(x => x.id === card.dataset.id);
                    if (p) openModal(p);
                });
            });

            // Add to cart from bento button
            grid.querySelectorAll('.bento-add-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const p = allProducts.find(x => x.id === btn.dataset.id);
                    if (p) addToCart(p);
                });
            });
        }

        // ── Filters ─────────────────────────────────────────────────────────
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCategory = btn.dataset.cat;
                render();
            });
        });

        document.querySelectorAll('.count-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                displayCount = parseInt(btn.dataset.count);
                render();
            });
        });

        document.getElementById('search-input').addEventListener('input', render);

        // ── Cart ────────────────────────────────────────────────────────────
        function addToCart(product) {
            const existing = cart.find(i => i.id === product.id);
            if (existing) existing.quantity++;
            else cart.push({ ...product, quantity: 1 });
            updateCartUI();
            flashCartBtn();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const total = cart.reduce((s, i) => s + parseFloat(i.price.replace(',', '')) * i.quantity, 0);
            const count = cart.reduce((s, i) => s + i.quantity, 0);

            badge.textContent = count;
            badge.classList.toggle('hidden', count === 0);

            document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
            document.getElementById('submit-order-btn').disabled = cart.length === 0;

            const container = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('cart-empty-msg');

            if (cart.length === 0) {
                container.innerHTML = '';
                container.appendChild(emptyMsg);
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            container.innerHTML = cart.map(item => `
                <div class="cart-item-row flex items-center gap-3 p-3 rounded-lg" style="background:var(--color-bg-dark);">
                    <img src="${item.image}" alt="${item.name}" class="w-14 h-14 object-cover rounded-md flex-shrink-0"
                         onerror="this.src='https://placehold.co/56x56/5B5049/DDDDD8?text=?'">
                    <div class="flex-grow min-w-0">
                        <p class="text-sm font-medium truncate">${item.name}</p>
                        <p class="text-xs text-[#5B5049]">x${item.quantity} — $${(parseFloat(item.price.replace(',',''))*item.quantity).toFixed(2)}</p>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="text-[#5B5049] hover:text-red-400 transition-colors flex-shrink-0">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        function flashCartBtn() {
            const btn = document.getElementById('cart-btn');
            btn.classList.add('scale-125');
            setTimeout(() => btn.classList.remove('scale-125'), 200);
        }

        // Cart open/close
        document.getElementById('cart-btn').addEventListener('click', () => {
            document.getElementById('cart-sidebar').classList.remove('translate-x-full');
            document.getElementById('cart-overlay').classList.remove('hidden');
        });
        function closeCart() {
            document.getElementById('cart-sidebar').classList.add('translate-x-full');
            document.getElementById('cart-overlay').classList.add('hidden');
        }
        document.getElementById('close-cart').addEventListener('click', closeCart);
        document.getElementById('cart-overlay').addEventListener('click', closeCart);

        // ── Submit order ────────────────────────────────────────────────────
        document.getElementById('submit-order-btn').addEventListener('click', async () => {
            const btn = document.getElementById('submit-order-btn');
            const status = document.getElementById('order-status');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Enviando...';

            try {
                const res = await fetch('/order/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cart: cart.map(i => ({ id: i.id, quantity: i.quantity })),
                        notes: document.getElementById('order-notes').value,
                    }),
                });
                const data = await res.json();
                status.textContent = data.message;
                status.className = 'text-sm text-center rounded-md p-2 ' +
                    (data.status === 'success' ? 'bg-green-900 bg-opacity-40 text-green-300 border border-green-600'
                                               : 'bg-red-900 bg-opacity-40 text-red-300 border border-red-600');
                status.classList.remove('hidden');
                if (data.status === 'success') {
                    cart = [];
                    updateCartUI();
                }
            } catch (e) {
                status.textContent = 'Error al enviar. Intenta de nuevo.';
                status.className = 'text-sm text-center rounded-md p-2 bg-red-900 bg-opacity-40 text-red-300';
                status.classList.remove('hidden');
            }
            btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Solicitar cotización';
            btn.disabled = cart.length === 0;
        });

        // ── Product modal ───────────────────────────────────────────────────
        function openModal(p) {
            currentModalProduct = p;
            document.getElementById('modal-img').src = p.image;
            document.getElementById('modal-name').textContent = p.name;
            document.getElementById('modal-desc').textContent = p.description;
            document.getElementById('modal-price').textContent = `$${p.price}`;
            document.getElementById('modal-category').textContent = p.category;
            document.getElementById('product-modal').classList.remove('hidden');
            document.getElementById('product-modal').classList.add('flex');
        }
        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
            document.getElementById('product-modal').classList.remove('flex');
        }
        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('product-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('product-modal')) closeModal();
        });
        document.getElementById('modal-add-btn').addEventListener('click', () => {
            if (currentModalProduct) { addToCart(currentModalProduct); closeModal(); }
        });

        // Make removeFromCart accessible from inline handlers
        window.removeFromCart = removeFromCart;

        loadProducts();
    })();
    </script>
</body>
</html>
